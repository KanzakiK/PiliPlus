name: Build Mac (custom)

on:
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze Dart (no build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS

      - name: Analyze
        run: flutter analyze --no-fatal-warnings

  build-mac-app:
    name: Build Mac
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 macOS

      - name: Build Mac
        run: flutter build macos --release --dart-define-from-file=pili_release.json --no-pub

      - name: Check architectures
        run: lipo -info build/macos/Build/Products/Release/PiliPlus.app/Contents/MacOS/PiliPlus

      - name: Prepare DMG
        run: |
          npm install --global create-dmg
          create-dmg build/macos/Build/Products/Release/PiliPlus.app || true
        continue-on-error: true

      - name: Rename DMG
        run: mv PiliPlus*.dmg PiliPlus_macos_${{ env.version }}.dmg

      - name: Pack app bundle
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/PiliPlus.app PiliPlus_macos_app.zip

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-dmg
          path: PiliPlus_macos_*.dmg

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: macOS-app
          path: PiliPlus_macos_app.zip
